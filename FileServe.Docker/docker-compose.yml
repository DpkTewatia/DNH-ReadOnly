services:
  fileserve:
    build: .
    image: fileserve:latest
    container_name: fileserve
    restart: unless-stopped
    ports:
      # host:container -- change the host port if 8080 is taken.
      - "8080:8080"
    volumes:
      # Point the left-hand side at the folder holding your images and .txt files.
      # ":ro" means the container cannot modify it even if something tried to.
      - ./files:/data:ro
    environment:
      # Every FileVault option can be overridden here; "__" is the section separator.
      FileVault__RootPath: /data
      FileVault__RequestPath: /files
      FileVault__EnableDirectoryBrowsing: "true"
      FileVault__CacheMaxAgeSeconds: "3600"
      # "true" makes browsers download files instead of rendering them inline.
      FileVault__ForceDownload: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
